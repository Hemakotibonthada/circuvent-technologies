; Circuvent RFID Reader (rfid-only) — open THIS folder in PlatformIO, then Upload.
[platformio]
src_dir = .
default_envs = rfid-only

[env:rfid-only]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
; See rfid-attend's note: `lib_extra_dirs = ..` makes every folder under
; firmware/ a library candidate, including this one, which would compile the
; sketch outside the src build and lose lib_deps. Ignoring ourselves keeps the
; folder a project.
lib_ignore = rfid-only
; The default packet size is deliberately left alone. This model carries no
; allow-list — the largest thing it ever publishes is a single card read, under
; 200 bytes. rfid-attend needs 4096 because it *receives* a roster in chunks; a
; reader that makes no access decision does not.
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8
    miguelbalboa/MFRC522 @ ^1.4.11
