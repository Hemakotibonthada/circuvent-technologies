; Circuvent RFID Attend — open THIS folder in the PlatformIO IDE, then Upload.
[platformio]
src_dir = .
default_envs = rfid-attend

[env:rfid-attend]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
; `lib_extra_dirs = ..` makes every folder under firmware/ a candidate library,
; which is how the shared CircuventDevice resolves. The moment this project
; gained a header of its own (attend_types.h), that same rule made PlatformIO
; treat the sketch folder as a library too — it got compiled outside the src
; build and lost access to lib_deps, failing on ArduinoJson.h with no hint as
; to why. Ignoring ourselves as a library keeps `#include "attend_types.h"`
; (quoted, so resolved next to the sketch) working while the folder stays a
; project. drone-link carries the same line for the same reason.
lib_ignore = rfid-attend
; 4096 rather than the fleet's usual 1024. The allow-list is pushed in chunks
; and a chunk of a hundred card numbers is around 900 bytes of JSON before the
; envelope; at 1024 the packets would be silently dropped by PubSubClient and
; the roster would never commit.
build_flags = -DMQTT_MAX_PACKET_SIZE=4096
; Two app slots are required for OTA, and the default partition table gives the
; sketch 1.3 MB. This one carries a card reader, a display and a font, so it is
; close enough to that ceiling to be worth saying: if it stops fitting, move to
; min_spiffs.csv rather than dropping OTA.
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8
    miguelbalboa/MFRC522 @ ^1.4.11
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    ; GFX includes Adafruit_I2CDevice.h but does not declare BusIO as a
    ; dependency PlatformIO can see, so the build fails on a missing header
    ; unless it is named here.
    adafruit/Adafruit BusIO @ ^1.16.1
