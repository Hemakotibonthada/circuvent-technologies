; PlatformIO project for all Circuvent device firmware.
;
; One environment per device. Build/upload the one you're flashing:
;   pio run -e smart-plug -t upload    # compile + flash over USB
;   pio device monitor                 # serial @115200
; In the PlatformIO IDE (VS Code): open this `firmware/` folder, pick the
; environment in the bottom status bar, then click Upload (→) and Monitor.
;
; The shared, header-only CircuventDevice library is pulled in via an include
; path (build_flags -I), so no manual copying into a libraries/ folder is
; needed. Per-device extra libraries are listed under each environment.

[platformio]
src_dir = .
default_envs = smart-plug

[env]
platform = espressif32
framework = arduino
; ESP32 Dev Module. Change to match your board, e.g.:
;   esp32-c3-devkitm-1, esp32-s3-devkitc-1, lolin_s2_mini
; For ESP8266 use platform = espressif8266 and board = nodemcuv2 / esp01_1m.
board = esp32dev
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_ldf_mode = deep+
build_flags =
    -I "$PROJECT_DIR/CircuventDevice"
    -DMQTT_MAX_PACKET_SIZE=1024
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8

; --- Devices that only need CircuventDevice + ArduinoJson + PubSubClient -----
[env:aquaguard]
build_src_filter = -<*> +<aquaguard/>

[env:agri-starter]
build_src_filter = -<*> +<agri-starter/>

[env:energy-monitor]
build_src_filter = -<*> +<energy-monitor/>

[env:motion-sensor]
build_src_filter = -<*> +<motion-sensor/>

[env:home-hub]
build_src_filter = -<*> +<home-hub/>

; --- Smart Plug / Switch: Alexa + Google Home via fauxmoESP (needs AsyncTCP) --
[env:smart-plug]
build_src_filter = -<*> +<smart-plug/>
lib_deps =
    ${env.lib_deps}
    https://github.com/vintlabs/fauxmoESP.git
    https://github.com/me-no-dev/AsyncTCP.git

[env:smart-switch]
build_src_filter = -<*> +<smart-switch/>
lib_deps =
    ${env.lib_deps}
    https://github.com/vintlabs/fauxmoESP.git
    https://github.com/me-no-dev/AsyncTCP.git

; --- Guardian: GPS via TinyGPSPlus ------------------------------------------
[env:guardian]
build_src_filter = -<*> +<guardian/>
lib_deps =
    ${env.lib_deps}
    mikalhart/TinyGPSPlus @ ^1.0.3
