; Circuvent Touch Board 8 — open THIS folder in the PlatformIO IDE, then Upload.
[platformio]
src_dir = .
default_envs = touchboard-8

[env:touchboard-8]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
build_flags = -DMQTT_MAX_PACKET_SIZE=1024
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8
