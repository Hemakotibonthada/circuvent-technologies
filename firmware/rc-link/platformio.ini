; Circuvent RC Link — the phone dongle. Open THIS folder, then Upload.
;
; An ESP32-S3 on a USB-C OTG cable. The S3 is not optional: it has native USB,
; which is what lets the board present itself to the phone as a network
; interface rather than needing a USB-serial chip and an Android driver.
[platformio]
src_dir = .
default_envs = rc-link

[env:rc-link]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
; Without this the sketch folder is treated as a library and loses lib_deps.
lib_ignore = rc-link
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Must match the car. Peers on different channels do not hear each other
    ; and there is no error to see — it looks exactly like being out of range.
    -DCV_RC_CHANNEL=6
