; Circuvent Camera — open THIS folder in the PlatformIO IDE, then Upload.
;
; The AI-Thinker ESP32-CAM has no USB. Wire an FTDI adapter to U0R/U0T, bridge
; IO0 to GND, and press RESET to enter the bootloader before uploading.
[platformio]
src_dir = .
default_envs = camera

[env:camera]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
; min_spiffs, not huge_app.
;
; huge_app.csv defines a single 3MB app partition and no app1, so there is
; nowhere for an update to be written — httpUpdate fails outright and a camera
; could only ever be reflashed over the wire with an FTDI adapter, on a board
; that has no USB. min_spiffs gives two 1.9MB slots; this build is 1.12MB, so
; it fits with room to grow and cameras become updatable like everything else.
board_build.partitions = min_spiffs.csv
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Board profile: 1=AI-Thinker (default) 2=WROVER-KIT 3=M5Stack-Wide 4=TTGO T-Journal
    -DCV_CAM_BOARD=1
    ; Set to a GPIO number to also accept a hardware PIR alongside image motion.
    -DPIR_GPIO_NUM=-1
; SD_MMC.h includes FS.h and the dependency finder does not give it that
; include path. See fs_include.py — the fix cannot live in build_flags because
; the interpolated Windows path loses its separators there.
extra_scripts = pre:fs_include.py
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8
    SD_MMC

; Same board, no external PSRAM soldered (rare clones). Frames are clamped to
; QVGA automatically at runtime, but dropping the PSRAM flags saves flash.
[env:camera-nopsram]
extends = env:camera
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DCV_CAM_BOARD=1
    -DPIR_GPIO_NUM=-1

; Two-way audio. Build this only on a board that has an I2S MEMS microphone
; (INMP441 / SPH0645) and an I2S amplifier (MAX98357A) soldered on — the stock
; AI-Thinker ESP32-CAM has neither, and this build produces silence on one.
;
; Wiring, and what each pin costs — see the pin-budget note in camera.ino:
;   BCLK  GPIO 12  -> mic SCK  + amp BCLK   (free; SD D2, unused in 1-bit mode)
;   LRCLK GPIO 13  -> mic WS   + amp LRC    (free; SD D3, unused in 1-bit mode)
;   DOUT  GPIO 33  -> amp DIN               (costs the small red status LED)
;   DIN   GPIO  3  <- mic SD                (costs the serial console's RX line)
;   mic L/R -> GND (left channel), amp GAIN -> floating (9 dB), both 3V3 + GND
;
; GPIO 16 is NOT available despite what the pinout diagrams say: on a WROVER
; module it is the PSRAM chip select. Using it corrupts frame memory silently.
[env:camera-audio]
extends = env:camera
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCV_CAM_BOARD=1
    -DPIR_GPIO_NUM=-1
    -DCV_AUDIO=1
