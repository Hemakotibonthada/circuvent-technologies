; Circuvent Camera — open THIS folder in the PlatformIO IDE, then Upload.
;
; The AI-Thinker ESP32-CAM has no USB. Wire an FTDI adapter to U0R/U0T, bridge
; IO0 to GND, and press RESET to enter the bootloader before uploading.
[platformio]
src_dir = .
default_envs = camera

[env:camera]
platform = espressif32
board = esp32cam
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
board_build.partitions = huge_app.csv
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    ; Board profile: 1=AI-Thinker (default) 2=WROVER-KIT 3=M5Stack-Wide 4=TTGO T-Journal
    -DCV_CAM_BOARD=1
    ; Set to a GPIO number to also accept a hardware PIR alongside image motion.
    -DPIR_GPIO_NUM=-1
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8

; Same board, no external PSRAM soldered (rare clones). Frames are clamped to
; QVGA automatically at runtime, but dropping the PSRAM flags saves flash.
[env:camera-nopsram]
extends = env:camera
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DCV_CAM_BOARD=1
    -DPIR_GPIO_NUM=-1
