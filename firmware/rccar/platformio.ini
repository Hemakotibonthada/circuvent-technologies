; Circuvent RC Car — open THIS folder in the PlatformIO IDE, then Upload.
;
; Wiring, in the order it matters:
;
;   H-bridge IN1 ◀── PIN_MOTOR_A        DRV8871 / TB6612 class, 2-cell rated
;   H-bridge IN2 ◀── PIN_MOTOR_B
;   Steering servo ◀ PIN_STEER_SERVO    powered from its own 5 V BEC, not 3V3
;   Battery divider ─▶ PIN_VBAT         1:2, so a 2S pack reads under 3.3 V
;   Wheel sensor ───▶ PIN_WHEEL         optional; speed reads 0 without it
;
; POWER THE SERVO FROM ITS OWN REGULATOR. A steering servo stalling against
; full lock pulls more than the ESP32's regulator will give, and the board
; browns out — which resets the radio, which triggers the failsafe, on a car
; that is at that moment turning as hard as it can.
;
; The target is an ESP32-S3 with PSRAM because the camera shares this board.
; A plain ESP32 without PSRAM builds and runs until the first JPEG over about
; 30 KB, then reboots mid-drive.
[platformio]
src_dir = .
default_envs = rccar

[env:rccar]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
; lib_extra_dirs makes every sibling folder holding a header look like a
; library, including this sketch's own — and a sketch compiled as a library
; loses its lib_deps, which fails on an include several files away from the
; cause. Naming it here keeps it a sketch.
lib_ignore = rccar
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8
board_build.partitions = huge_app.csv
build_flags =
    -DBOARD_HAS_PSRAM
    ; The ESP-NOW channel both ends agree on. It has to be fixed: if the AP
    ; picks a channel, the control link moves whenever the camera's Wi-Fi
    ; re-scans, and the car stops answering for no visible reason.
    -DCV_RC_CHANNEL=6
