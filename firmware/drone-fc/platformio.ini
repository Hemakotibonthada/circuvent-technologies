; Circuvent Drone X1 flight controller.
;
; SAFETY: read the commissioning ladder in Docs/22-drone-x1.md before fitting
; propellers. This is a new flight stack and has never flown. Steps 1-3 are
; done with the props OFF or the aircraft strapped down, and step 3 is the one
; that catches a reversed axis -- which at hover is an aircraft in the ground
; in about 300 ms.
;
; ESP32-S3 only, and not for convenience. The control loop is pinned to core 1
; with the radio stack on core 0; a single-core part cannot make that
; separation, and sharing a core with the Wi-Fi driver produces bursts of
; missed deadlines rather than an even slowdown.
[platformio]
src_dir = .
default_envs = drone-fc

[env:drone-fc]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
; Ignoring ourselves as a library: `lib_extra_dirs = ..` makes every folder
; under firmware/ a candidate library, so a project with headers of its own
; gets compiled outside the src build and loses lib_deps. That failure surfaces
; as a missing ArduinoJson.h inside the shared library, pointing nowhere near
; the cause. Documented in Docs/07.
lib_ignore = drone-fc
board_build.partitions = min_spiffs.csv
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; -O2 over the default -Os. The rate loop is float-heavy and runs a
    ; thousand times a second; the size traded is a few kB of a 1.9 MB slot,
    ; and the headroom buys margin against the loop deadline.
    -O2
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8
