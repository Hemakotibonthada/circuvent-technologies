; Circuvent ANPR Camera — open THIS folder in the PlatformIO IDE, then Upload.
;
; The recommended board is an ESP32-S3 CAM module: it has native USB (so no
; FTDI adapter and no IO0 jumper), 8 MB of PSRAM, and enough spare GPIO that
; the loop input, illuminator and barrier relay do not have to fight the
; camera bus. On an AI-Thinker ESP32-CAM all three of those become a
; compromise, which is why it is the fallback environment and not the default.
[platformio]
src_dir = .
default_envs = anpr-cam

; ---------------------------------------------------------------------------
; Primary: Freenove ESP32-S3 WROOM CAM (OV2640/OV5640, 8 MB PSRAM, USB-C)
; ---------------------------------------------------------------------------
[env:anpr-cam]
platform = espressif32
board = esp32s3camlcd
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
; min_spiffs, not huge_app.
;
; huge_app.csv defines a single 3 MB app partition and no app1, so there is
; nowhere for an update to be written and the device could only ever be
; reflashed over USB — on a unit that is by then bolted to a gate post.
; min_spiffs gives two ~1.9 MB slots, so ANPR cameras stay OTA-updatable.
board_build.partitions = min_spiffs.csv
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DBOARD_HAS_PSRAM
    ; Board profile: 1=ESP32-S3 WROOM CAM  2=XIAO ESP32S3 Sense  3=AI-Thinker
    -DCV_ANPR_BOARD=1
    ; Vehicle presence input (inductive loop or IR beam), active-low. -1 = none,
    ; in which case the lane is triggered by image motion inside the ROI alone.
    -DLOOP_GPIO_NUM=40
    ; IR illuminator, PWM 0-100%. -1 = none.
    -DILLUM_GPIO_NUM=41
    ; Dry-contact barrier relay. -1 = none, which is the right value when the
    ; gate is driven by a separate rfid-gate device over an automation.
    -DRELAY_GPIO_NUM=42
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8

; ---------------------------------------------------------------------------
; Seeed XIAO ESP32S3 Sense — thumbnail-sized, 8 MB PSRAM, but only a handful
; of exposed pads. Good for a discreet parking-bay install where the barrier
; is driven by another device and no loop detector is fitted.
; ---------------------------------------------------------------------------
[env:anpr-cam-xiao]
extends = env:anpr-cam
board = seeed_xiao_esp32s3
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DBOARD_HAS_PSRAM
    -DCV_ANPR_BOARD=2
    -DLOOP_GPIO_NUM=1
    -DILLUM_GPIO_NUM=2
    -DRELAY_GPIO_NUM=3

; ---------------------------------------------------------------------------
; Fallback: AI-Thinker ESP32-CAM.
;
; Works, with real limits that belong in the listing and not in a footnote:
; 4 MB PSRAM caps sustained capture at SVGA, the OV2640 is noisier after dark,
; and the board must be flashed with an FTDI adapter. Expect it to read plates
; on a stopping vehicle at 3-4 m in daylight, and to need the IR illuminator
; and a slower approach at night.
;
; The reset button is disabled here on purpose (CV_RESET_BTN=-1): the pin the
; other device profiles use for it, GPIO 0, is this board's camera XCLK. The
; compile-time guard in anpr-cam.ino would reject it anyway.
; ---------------------------------------------------------------------------
[env:anpr-cam-aithinker]
extends = env:anpr-cam
board = esp32cam
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCV_ANPR_BOARD=3
    -DLOOP_GPIO_NUM=13
    ; GPIO 4 is the on-board white flood LED. It is far too close to the lens
    ; to light a retro-reflective plate without blowing it out, so it stays
    ; available but defaults to 0 %. Fit a separate 850 nm IR lamp instead.
    -DILLUM_GPIO_NUM=4
    -DRELAY_GPIO_NUM=16
    -DCV_RESET_BTN=-1
