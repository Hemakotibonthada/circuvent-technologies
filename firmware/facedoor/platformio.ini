; Circuvent FaceDoor — open THIS folder in the PlatformIO IDE, then Upload.
[platformio]
src_dir = .
default_envs = facedoor

[env:facedoor]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
build_flags = -DMQTT_MAX_PACKET_SIZE=1024
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8
    ; The 128x64 OLED on the door panel. Optional at runtime — begin() returns
    ; false when no panel answers on I2C and the firmware carries on without
    ; one — but the driver is always linked, because a build that only works on
    ; the units that happen to have a screen fitted is two firmwares to keep
    ; straight for the sake of 12 KB of flash.
    adafruit/Adafruit SSD1306 @ ^2.5.9
    adafruit/Adafruit GFX Library @ ^1.11.9
    ; GFX includes Adafruit_I2CDevice.h but does not declare BusIO as a
    ; dependency PlatformIO can see, so the build fails on a missing header
    ; unless it is named here.
    adafruit/Adafruit BusIO @ ^1.16.1
