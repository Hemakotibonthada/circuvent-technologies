; Circuvent Drone Link — open THIS folder in the PlatformIO IDE, then Upload.
;
; The board goes on the airframe and talks to the flight controller's TELEM
; port over 3.3 V TTL serial. Wire it:
;
;     FC TELEM TX  ──▶  MAV_RX_PIN
;     FC TELEM RX  ◀──  MAV_TX_PIN
;     FC 5V        ──▶  5V   (a BEC, not the flight pack directly)
;     FC GND       ───   GND
;
; Do NOT power this from the same regulator as the receiver. A brownout here is
; harmless; a brownout on the RC link is not, and sharing a rail couples them.
;
; The default target is a plain ESP32-WROOM-32: it is the cheapest board with
; three hardware UARTs, which matters because UART0 stays on USB so the bridge
; can be debugged while it is bridging.
[platformio]
src_dir = .
default_envs = drone-link

; ---------------------------------------------------------------------------
; Primary: ESP32-WROOM-32 devkit
; ---------------------------------------------------------------------------
[env:drone-link]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
; `lib_extra_dirs = ..` makes every folder under firmware/ a candidate library,
; which is how the shared CircuventDevice resolves. The moment this project
; gained a header of its own, that same rule made PlatformIO treat the sketch
; folder as a library too — it got compiled outside the src build and lost
; access to lib_deps, failing on ArduinoJson.h with no hint as to why. Ignoring
; ourselves as a library keeps `#include "drone-link.h"` (quoted, so resolved
; next to the sketch) working while the folder stays a project.
lib_ignore = drone-link
; min_spiffs, not huge_app: two ~1.9 MB slots so the unit stays OTA-updatable.
; A companion computer that can only be reflashed over USB is one that has to
; come off the airframe, and anything that has to come off the airframe
; eventually goes back on wrong.
board_build.partitions = min_spiffs.csv
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DCV_DRONE_BOARD=1
lib_deps =
    knolleary/PubSubClient @ ^2.8
    bblanchon/ArduinoJson @ ^7.1.0

; ---------------------------------------------------------------------------
; ESP32-S3 — native USB, more RAM. Worth it if the airframe also carries a
; camera payload this board has to buffer for.
; ---------------------------------------------------------------------------
[env:drone-link-s3]
extends = env:drone-link
board = esp32-s3-devkitc-1
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DCV_DRONE_BOARD=2
    -DARDUINO_USB_CDC_ON_BOOT=1

; ---------------------------------------------------------------------------
; ESP32-C3 — the light one. ~3 g on a supermini board, which on a 250-class
; airframe is the difference between carrying this and not.
; ---------------------------------------------------------------------------
[env:drone-link-c3]
extends = env:drone-link
board = esp32-c3-devkitm-1
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DCV_DRONE_BOARD=3
    ; The C3's USB is a Serial/JTAG peripheral, not the S3's OTG controller, so
    ; CDC_ON_BOOT alone leaves `Serial` undeclared and the build fails inside
    ; the shared library rather than in anything this project wrote.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
