; Circuvent Witness — open THIS folder in the PlatformIO IDE, then Upload.
;
; The board lives inside the CT clamp's own housing and has no connector for
; anything except programming. Nothing here touches mains: the core clamps
; round the outside of the appliance flex and the board only ever sees the
; induced secondary current.
;
; BEFORE POWERING A PROTOTYPE FROM A BENCH SUPPLY: the CT secondary must have
; either the shorting FET fitted or a burden resistor across it. An open
; secondary on a live conductor develops hundreds of volts. The firmware
; shorts it by default, but the firmware is not running while you are soldering.
;
; ESP32-C6, for the radio and for the sleep current. A C3 would do the job at
; 802.15.4 but draws more asleep, and this device is asleep almost always.
[platformio]
src_dir = .
default_envs = witness

[env:witness]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
; Without this the sketch folder is treated as a library and loses lib_deps.
lib_ignore = witness
build_flags =
    -DCV_WITNESS_CHANNEL=6
