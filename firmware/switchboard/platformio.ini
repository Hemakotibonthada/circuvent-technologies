; Circuvent Configurable Switchboard — open THIS folder in the PlatformIO IDE, then Upload.
;
; One image for every board shape. What it is wired to is commissioned on site
; and stored in NVS, so there is no per-layout build to pick from here.
[platformio]
src_dir = .
default_envs = switchboard

[env:switchboard]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
; This folder now contains a .h, which makes lib_extra_dirs treat the sketch
; itself as a library — and a sketch compiled as a library loses lib_deps.
lib_ignore = switchboard
build_flags = -DMQTT_MAX_PACKET_SIZE=1024
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8

