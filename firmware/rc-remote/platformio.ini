; Circuvent RC Remote — the handset. Open THIS folder, then Upload.
;
; Two potentiometer sticks into ADC1 pins. ADC1, not ADC2: ADC2 is unavailable
; while Wi-Fi is running, and this board has the radio on continuously — the
; symptom is a stick that reads zero the moment the link comes up.
[platformio]
src_dir = .
default_envs = rc-remote

[env:rc-remote]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
lib_ignore = rc-remote
build_flags =
    -DCV_RC_CHANNEL=6
