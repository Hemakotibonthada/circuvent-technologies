; Circuvent Sentinel — open THIS folder in the PlatformIO IDE, then Upload.
;
; Two environments from one source. Pick with the env switcher in the IDE, or:
;   pio run -e sentinel      -t upload      ; full panel  (ESP32 DevKit)
;   pio run -e sentinel-cam  -t upload      ; camera build (ESP32-CAM)
;
; The camera build drops gas sensing, the buzzer, the PIR and two relays. That
; is a hardware limit rather than a choice: the camera occupies all of ADC1
; except one pin that carries an LED, and an MQ-2 is an analog sensor that
; cannot use ADC2 while Wi-Fi is running. See the header of sentinel.ino.
[platformio]
src_dir = .
default_envs = sentinel

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8
    adafruit/DHT sensor library @ ^1.4.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14

[env:sentinel]
board = esp32dev
; The default table splits flash into two 1.25 MB app slots and a 1.5 MB SPIFFS
; partition this firmware never touches — it keeps everything in NVS. That left
; the image at ~80% of its slot, and an OTA has to fit in the other one. On a
; device whose job is to notice a gas leak, "the update won't fit" is not a
; failure worth risking, so the unused filesystem is traded for app space.
board_build.partitions = min_spiffs.csv
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
; Swap the climate sensor without touching the source:
;   build_flags = ${env:sentinel.build_flags} -DCV_DHT_TYPE=DHT22

[env:sentinel-cam]
board = esp32cam
; min_spiffs, not huge_app: huge_app.csv has a single app partition and no app1,
; so there is nowhere for an update to be written and this build could only ever
; be reflashed with an FTDI adapter — on a board that has no USB port. The same
; mistake kept every camera in the fleet permanently un-updatable until it was
; found; fixing it here too rather than leaving one variant stranded.
board_build.partitions = min_spiffs.csv
build_flags =
    ; 1024 is right even for frames: publishFrame streams them with
    ; beginPublish/write, so the buffer never has to hold a whole JPEG. Sizing
    ; it to a frame would burn RAM the camera driver needs for its own buffers.
    -DMQTT_MAX_PACKET_SIZE=1024
    -DCV_BOARD_CAM=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue

; ---------------------------------------------------------------------------
; 16-relay distribution-board unit. Relays move off GPIO onto an MCP23017, so
; 19/21/22/23 free up and I²C takes 21/22.
;
; Wiring notes that are not optional:
;   - Tie A0/A1/A2 on both chips. A floating address line makes the part answer
;     intermittently, which reads as a dry joint and wastes a day.
;   - Tie RESET high. Left floating the chip may never leave reset.
;   - Most opto-isolated relay boards are active LOW; set CV_RELAY_ACTIVE_LOW=1
;     to match yours. Getting it wrong energises everything at idle.
;   - 16 coils at ~70 mA is over 1 A on the 5 V rail. A dev board's regulator
;     will not do it — feed the relay board separately and share only ground.
; ---------------------------------------------------------------------------
[env:sentinel-max]
board = esp32dev
board_build.partitions = min_spiffs.csv
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DCV_BOARD_MAX=1
    -DCV_RELAY_EXPANDERS=1        ; 1 = 16 relays, 2 = 32 (second chip at 0x21)
    -DNUM_RELAY=16
    -DCV_RELAY_ACTIVE_LOW=1       ; typical opto relay board
    -DCV_HAS_BUTTONS=0            ; 1 adds a second MCP23017 of override buttons
