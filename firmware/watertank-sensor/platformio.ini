; Circuvent Tank Sensor — the tank-top half of the WaterTank Duo.
; Open THIS folder in the PlatformIO IDE, then Upload.
;
; No MQTT or WiFi libraries here: this unit only ever speaks LoRa. It pulls in
; CircuventDevice solely for CvTankLink.h and tweetnacl.
[platformio]
src_dir = .
default_envs = watertank-sensor

[env:watertank-sensor]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
lib_deps =
    sandeepmistry/LoRa @ ^0.8.0
