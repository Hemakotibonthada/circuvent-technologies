; Circuvent Smart Switch — open THIS folder in the PlatformIO IDE, then Upload.
[platformio]
src_dir = .
default_envs = smart-switch

[env:smart-switch]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
build_flags = -DMQTT_MAX_PACKET_SIZE=1024
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8
    https://github.com/vintlabs/fauxmoESP.git
    https://github.com/me-no-dev/AsyncTCP.git
