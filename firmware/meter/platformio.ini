; Circuvent Energy Meter — open THIS folder in the PlatformIO IDE, then Upload.
;
; Two products from one sketch:
;   cv-em1  single channel   -> pio run -e meter-1ch
;   cv-em3  three channel    -> pio run            (the default)
;
; This file used to be a verbatim copy of energy-monitor's, down to
; `default_envs = energy-monitor` — so the meter built into a directory named
; after a different product, and neither of the two channel counts the sketch
; is written around had a configuration at all. It built, because the sketch
; defaults to three channels on its own, which is exactly why nobody noticed.
[platformio]
src_dir = .
default_envs = meter

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_ldf_mode = deep+
lib_extra_dirs = ..
lib_deps =
    bblanchon/ArduinoJson @ ^7.1.0
    knolleary/PubSubClient @ ^2.8

; cv-em3. The default, and the build scripts/publish-firmware.cjs picks up for
; the `meter` device type — it takes the first firmware.bin under .pio/build,
; so the variants below are deliberately NOT in default_envs. A single-channel
; image published as the three-channel product would report two of its three
; channels as permanently zero.
[env:meter]
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DMETER_CHANNELS=3
    -DMETER_PART=PART_BL0937

; cv-em1.
[env:meter-1ch]
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DMETER_CHANNELS=1
    -DMETER_PART=PART_BL0937

; The same boards with the alternative front end fitted. SEL polarity is
; inverted between the two parts, so this is not a cosmetic switch — see
; "trap one" at the top of meter.ino.
[env:meter-hlw]
build_flags =
    -DMQTT_MAX_PACKET_SIZE=1024
    -DMETER_CHANNELS=3
    -DMETER_PART=PART_HLW8012