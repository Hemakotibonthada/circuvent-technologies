version: "3.9"

services:
  # ── PostgreSQL Database ──
  postgres:
    image: postgres:16-alpine
    container_name: circuvent-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: circuvent_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: circuvent_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuvent_user -d circuvent_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (Caching & Message Queue) ──
  redis:
    image: redis:7-alpine
    container_name: circuvent-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── API Gateway ──
  api-gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_PATH: apps/api-gateway
    container_name: circuvent-gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (32+ chars)}
      - DATABASE_URL=postgresql://circuvent_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/circuvent_db
      - REDIS_URL=redis://redis:6379
      - GATEWAY_PORT=3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ── Project Tracker Service ──
  project-tracker:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_PATH: apps/services/project-tracker
    container_name: circuvent-project-tracker
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (32+ chars)}
      - DATABASE_URL=postgresql://circuvent_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/circuvent_db
      - PROJECT_TRACKER_PORT=3001
    depends_on:
      postgres:
        condition: service_healthy

  # ── IoT Registry Service ──
  iot-registry:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_PATH: apps/services/iot-registry
    container_name: circuvent-iot-registry
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (32+ chars)}
      - DATABASE_URL=postgresql://circuvent_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/circuvent_db
      - IOT_REGISTRY_PORT=3002
    depends_on:
      postgres:
        condition: service_healthy

  # ── HR & Payroll Service ──
  hr-payroll:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_PATH: apps/services/hr-payroll
    container_name: circuvent-hr-payroll
    restart: unless-stopped
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (32+ chars)}
      - DATABASE_URL=postgresql://circuvent_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/circuvent_db
      - HR_PAYROLL_PORT=3003
    depends_on:
      postgres:
        condition: service_healthy

  # ── Client Portal Service ──
  client-portal:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_PATH: apps/services/client-portal
    container_name: circuvent-client-portal
    restart: unless-stopped
    ports:
      - "3004:3004"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (32+ chars)}
      - DATABASE_URL=postgresql://circuvent_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/circuvent_db
      - CLIENT_PORTAL_PORT=3004
    depends_on:
      postgres:
        condition: service_healthy

  # ── AI Orchestrator Service ──
  ai-orchestrator:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_PATH: apps/services/ai-orchestrator
    container_name: circuvent-ai-orchestrator
    restart: unless-stopped
    ports:
      - "3006:3006"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (32+ chars)}
      - DATABASE_URL=postgresql://circuvent_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/circuvent_db
      - AI_ORCHESTRATOR_PORT=3006
    depends_on:
      postgres:
        condition: service_healthy

  # ── Financial Ledger Service ──
  financial-ledger:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_PATH: apps/services/financial-ledger
    container_name: circuvent-financial-ledger
    restart: unless-stopped
    ports:
      - "3007:3007"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (32+ chars)}
      - DATABASE_URL=postgresql://circuvent_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/circuvent_db
      - FINANCIAL_LEDGER_PORT=3007
    depends_on:
      postgres:
        condition: service_healthy

  # ── ATS Engine Service ──
  ats-engine:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE_PATH: apps/services/ats-engine
    container_name: circuvent-ats-engine
    restart: unless-stopped
    ports:
      - "3008:3008"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET in .env (32+ chars)}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env (32+ chars)}
      - DATABASE_URL=postgresql://circuvent_user:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/circuvent_db
      - ATS_ENGINE_PORT=3008
    depends_on:
      postgres:
        condition: service_healthy

  # ── Next.js Web Frontend ──
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    container_name: circuvent-web
    restart: unless-stopped
    ports:
      - "3005:3005"
    environment:
      - NEXT_PUBLIC_API_URL=http://api-gateway:3000/api
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
