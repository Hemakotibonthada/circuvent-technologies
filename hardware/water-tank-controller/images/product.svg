<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600" viewBox="0 0 600 600" font-family="Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e0f2fe"/><stop offset="1" stop-color="#ede9fe"/>
    </linearGradient>
    <linearGradient id="case" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#dbe2ea"/>
    </linearGradient>
    <linearGradient id="scr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)"/>

  <!-- device body -->
  <rect x="150" y="120" width="300" height="360" rx="26" fill="url(#case)" stroke="#94a3b8" stroke-width="2"/>
  <rect x="150" y="120" width="300" height="70" rx="26" fill="#0b1020"/>
  <rect x="150" y="164" width="300" height="26" fill="#0b1020"/>
  <circle cx="192" cy="155" r="12" fill="none" stroke="#06b6d4" stroke-width="3"/>
  <text x="214" y="162" fill="#ffffff" font-size="22" font-weight="bold">Circu<tspan fill="#06b6d4">vent</tspan></text>

  <!-- status screen -->
  <rect x="190" y="220" width="220" height="120" rx="12" fill="#0b1020"/>
  <text x="210" y="258" fill="#22d3ee" font-size="14">TANK LEVEL</text>
  <text x="210" y="300" fill="#ffffff" font-size="44" font-weight="bold">72<tspan font-size="22">%</tspan></text>
  <rect x="300" y="270" width="90" height="16" rx="8" fill="#1f2937"/>
  <rect x="300" y="270" width="65" height="16" rx="8" fill="url(#scr)"/>
  <text x="300" y="316" fill="#34d399" font-size="12">PUMP: AUTO</text>

  <!-- LEDs + button -->
  <circle cx="215" cy="372" r="9" fill="#22c55e"/><text x="230" y="377" font-size="11" fill="#374151">PWR</text>
  <circle cx="300" cy="372" r="9" fill="#ef4444"/><text x="315" y="377" font-size="11" fill="#374151">PUMP</text>
  <circle cx="392" cy="372" r="16" fill="#e2e8f0" stroke="#94a3b8" stroke-width="2"/>
  <text x="372" y="404" font-size="10" fill="#6b7280">MANUAL</text>

  <!-- product name -->
  <text x="300" y="446" text-anchor="middle" fill="#0f172a" font-size="26" font-weight="bold">AquaGuard</text>
  <text x="300" y="468" text-anchor="middle" fill="#475569" font-size="13">Smart Water Tank Controller</text>

  <!-- probe -->
  <rect x="470" y="150" width="16" height="150" rx="6" fill="#64748b"/>
  <ellipse cx="478" cy="308" rx="22" ry="10" fill="#475569"/>
  <text x="440" y="330" font-size="10" fill="#6b7280">ultrasonic probe</text>

  <text x="300" y="540" text-anchor="middle" fill="#94a3b8" font-size="11">Render mockup - replace with studio photography before listing.</text>
</svg>
