# Circuvent WebSite — joins Platform Postgres network.
# Port 3022 published for pre-DNS smoke. Do not flip public DNS until healthy.
# Traefik YAML prepared separately under Coolify dynamic config.
services:
  website:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: circuvent-website
    restart: always
    env_file:
      - .env.production
    environment:
      - PORT=3022
      - NODE_ENV=production
      - DATABASE_SSL=false
      - DATABASE_DRIVER=pg
    ports:
      - "0.0.0.0:3022:3022"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - platform-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3022/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 8s
      retries: 10
      start_period: 90s

networks:
  platform-net:
    external: true
    name: platform_platform-net
