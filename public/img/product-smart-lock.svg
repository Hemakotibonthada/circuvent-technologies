<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Circuvent Smart Lock">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1226"/><stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="44%" r="55%">
      <stop offset="0" stop-color="#ef4444" stop-opacity="0.38"/><stop offset="1" stop-color="#ef4444" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f87171"/><stop offset="1" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#5b6488" stroke-width="1">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800M0 500H800M0 600H800M0 700H800"/>
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800M600 0V800M700 0V800"/>
  </g>
  <rect width="800" height="800" fill="url(#glow)"/>
  <g transform="translate(400 400)">
    <!-- shackle -->
    <path d="M-95 -40 V-110 a95 95 0 0 1 190 0 V-40" fill="none" stroke="url(#steel)" stroke-width="42" stroke-linecap="round"/>
    <!-- body -->
    <rect x="-160" y="-50" width="320" height="270" rx="42" fill="url(#body)"/>
    <rect x="-160" y="-50" width="320" height="270" rx="42" fill="none" stroke="#fff" stroke-opacity="0.18" stroke-width="3"/>
    <!-- keyhole -->
    <circle cx="0" cy="60" r="42" fill="#7f1d1d"/>
    <rect x="-14" y="60" width="28" height="80" rx="10" fill="#7f1d1d"/>
    <!-- status ring (smart) -->
    <circle cx="0" cy="60" r="42" fill="none" stroke="#fff" stroke-opacity="0.5" stroke-width="4"/>
    <!-- wifi glyph -->
    <g transform="translate(0 -6)" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" opacity="0.85">
      <path d="M-34 -10 a48 48 0 0 1 68 0"/>
      <path d="M-20 4 a28 28 0 0 1 40 0"/>
      <circle cx="0" cy="18" r="4" fill="#fff" stroke="none"/>
    </g>
  </g>
  <circle cx="120" cy="690" r="10" fill="url(#brand)"/>
  <text x="146" y="697" fill="#e7ecff" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="800">Circuvent</text>
  <text x="680" y="697" fill="#f87171" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="700" text-anchor="end">Smart Lock</text>
</svg>
