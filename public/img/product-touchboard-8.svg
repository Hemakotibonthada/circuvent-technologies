<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Circuvent Touch Switchboard 8">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1226"/><stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.45"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="accentFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.95"/><stop offset="1" stop-color="#2dd4bf" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#5b6488" stroke-width="1">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800M0 500H800M0 600H800M0 700H800"/>
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800M600 0V800M700 0V800"/>
  </g>
  <rect width="800" height="800" fill="url(#glow)"/>
  <g transform="translate(400 350)">
    <rect x="-200" y="-165" width="400" height="330" rx="28" fill="url(#metal)"/>
    <rect x="-190" y="-155" width="380" height="310" rx="20" fill="#f8fafc"/>
    <!-- 8 pads, two rows of four, mirroring the physical plate -->
    <g>
      <circle cx="-150" cy="-88" r="38" fill="#0f172a"/>
      <circle cx="-150" cy="-88" r="38" fill="none" stroke="#2dd4bf" stroke-width="5" opacity="1"/>
      <circle cx="-50" cy="-88" r="38" fill="#0f172a"/>
      <circle cx="-50" cy="-88" r="38" fill="none" stroke="#2dd4bf" stroke-width="5" opacity="0.55"/>
      <circle cx="50" cy="-88" r="38" fill="#0f172a"/>
      <circle cx="50" cy="-88" r="38" fill="none" stroke="#2dd4bf" stroke-width="5" opacity="0.55"/>
      <circle cx="150" cy="-88" r="38" fill="#0f172a"/>
      <circle cx="150" cy="-88" r="38" fill="none" stroke="#2dd4bf" stroke-width="5" opacity="0.55"/>
      <circle cx="-150" cy="8" r="38" fill="#0f172a"/>
      <circle cx="-150" cy="8" r="38" fill="none" stroke="#2dd4bf" stroke-width="5" opacity="0.55"/>
      <circle cx="-50" cy="8" r="38" fill="#0f172a"/>
      <circle cx="-50" cy="8" r="38" fill="none" stroke="#2dd4bf" stroke-width="5" opacity="0.55"/>
      <circle cx="50" cy="8" r="38" fill="#0f172a"/>
      <circle cx="50" cy="8" r="38" fill="none" stroke="#2dd4bf" stroke-width="5" opacity="1"/>
      <circle cx="150" cy="8" r="38" fill="#0f172a"/>
      <circle cx="150" cy="8" r="38" fill="none" stroke="#2dd4bf" stroke-width="5" opacity="0.55"/>
      <circle cx="-150" cy="-88" r="14" fill="#2dd4bf"/>
      <circle cx="50" cy="8" r="14" fill="#2dd4bf"/>
    </g>
    <!-- metering readout -->
    <rect x="-160" y="76" width="320" height="76" rx="14" fill="#0f172a"/>
    <text x="0" y="114" fill="#2dd4bf" font-family="ui-monospace,Menlo,monospace" font-size="30" font-weight="700" text-anchor="middle">230V  3.6A</text>
    <text x="0" y="142" fill="#94a3b8" font-family="ui-monospace,Menlo,monospace" font-size="22" text-anchor="middle">828 W · PF 0.97</text>
  </g>
  <circle cx="120" cy="690" r="10" fill="url(#brand)"/>
  <text x="146" y="697" fill="#e7ecff" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="800">Circuvent</text>
  <text x="680" y="697" fill="#2dd4bf" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="700" text-anchor="end">Touch Switchboard 8</text>
</svg>
