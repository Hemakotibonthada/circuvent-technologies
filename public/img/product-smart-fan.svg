<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Circuvent Smart Fan">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1226"/><stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="55%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.4"/><stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/><stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#5b6488" stroke-width="1">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800M0 500H800M0 600H800M0 700H800"/>
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800M600 0V800M700 0V800"/>
  </g>
  <rect width="800" height="800" fill="url(#glow)"/>
  <!-- downrod + ceiling mount -->
  <rect x="388" y="120" width="24" height="120" rx="6" fill="#475569"/>
  <rect x="340" y="108" width="120" height="20" rx="8" fill="#334155"/>
  <g transform="translate(400 400)">
    <!-- 4 blades -->
    <g>
      <g transform="rotate(0)"><path d="M0 -30 L250 -70 Q285 -60 285 -25 L0 30 Z" fill="url(#blade)" opacity="0.95"/></g>
      <g transform="rotate(90)"><path d="M0 -30 L250 -70 Q285 -60 285 -25 L0 30 Z" fill="url(#blade)" opacity="0.9"/></g>
      <g transform="rotate(180)"><path d="M0 -30 L250 -70 Q285 -60 285 -25 L0 30 Z" fill="url(#blade)" opacity="0.85"/></g>
      <g transform="rotate(270)"><path d="M0 -30 L250 -70 Q285 -60 285 -25 L0 30 Z" fill="url(#blade)" opacity="0.9"/></g>
    </g>
    <!-- motion arcs -->
    <g fill="none" stroke="#a5f3fc" stroke-width="8" stroke-linecap="round" opacity="0.5">
      <path d="M300 -40 A305 305 0 0 1 300 40"/>
      <path d="M-300 40 A305 305 0 0 1 -300 -40"/>
    </g>
    <!-- hub -->
    <circle cx="0" cy="0" r="70" fill="#1e293b" stroke="#334155" stroke-width="6"/>
    <circle cx="0" cy="0" r="34" fill="url(#brand)"/>
    <circle cx="0" cy="0" r="12" fill="#fff" opacity="0.9"/>
  </g>
  <circle cx="120" cy="690" r="10" fill="url(#brand)"/>
  <text x="146" y="697" fill="#e7ecff" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="800">Circuvent</text>
  <text x="680" y="697" fill="#22d3ee" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="700" text-anchor="end">Smart Fan</text>
</svg>
