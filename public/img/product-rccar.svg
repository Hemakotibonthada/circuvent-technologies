<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" role="img" aria-label="Circuvent RC Car">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1226"/><stop offset="1" stop-color="#0a0f1f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="55%">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.45"/><stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#06b6d4"/><stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e8f0"/><stop offset="1" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="accentFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.95"/><stop offset="1" stop-color="#f97316" stop-opacity="0.6"/>
    </linearGradient>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <g opacity="0.12" stroke="#5b6488" stroke-width="1">
    <path d="M0 100H800M0 200H800M0 300H800M0 400H800M0 500H800M0 600H800M0 700H800"/>
    <path d="M100 0V800M200 0V800M300 0V800M400 0V800M500 0V800M600 0V800M700 0V800"/>
  </g>
  <rect width="800" height="800" fill="url(#glow)"/>
  <g transform="translate(400 340)">
      <!--
        The car seen head-on, because that is the view a driver has of it and
        the one the headlights are on. The lamps are drawn lit: this product is
        a car that behaves like a car — indicators that blink together as a
        hazard, a brake light that comes on when it slows — and a picture with
        the lamps dark would be a picture of a toy.
      -->
      <g fill="#f97316" opacity="0.16">
        <rect x="-190" y="-70" width="380" height="140" rx="34"/>
      </g>
      <g stroke="#f97316" stroke-width="6" fill="none" stroke-linecap="round" opacity="0.85">
        <path d="M-190 20 h380"/>
        <path d="M-150 -20 q40 -60 150 -60 q110 0 150 60"/>
      </g>
      <g fill="#f97316" opacity="0.35">
        <circle cx="-110" cy="70" r="40"/><circle cx="110" cy="70" r="40"/>
      </g>
      <!-- headlamps, lit -->
      <g fill="#fde68a">
        <circle cx="-150" cy="-4" r="14"/><circle cx="150" cy="-4" r="14"/>
      </g>
      <!-- the camera, which is the reason this is not just a car -->
      <g fill="#0f172a" opacity="0.8"><rect x="-22" y="-96" width="44" height="26" rx="8"/></g>
      <g fill="#f97316"><circle cx="0" cy="-83" r="7"/></g>
    </g>
  <circle cx="120" cy="690" r="10" fill="url(#brand)"/>
  <text x="146" y="697" fill="#e7ecff" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="30" font-weight="800">Circuvent</text>
  <text x="680" y="697" fill="#f97316" font-family="system-ui,Segoe UI,Roboto,sans-serif" font-size="26" font-weight="700" text-anchor="end">RC Car</text>
</svg>
