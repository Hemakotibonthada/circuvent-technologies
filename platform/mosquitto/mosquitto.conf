# Circuvent MQTT broker — device-facing, fully self-owned.
persistence true
persistence_location /mosquitto/data/

# Realtime tuning: disable Nagle's algorithm so small control packets
# (turn on/off, scene) are sent immediately instead of being buffered
# (~40ms). Meaningful for interactive command latency.
set_tcp_nodelay true

# No anonymous clients. Auth via password file; per-topic access via ACLs.
allow_anonymous false
password_file /mosquitto/pw/passwordfile
acl_file /mosquitto/config/aclfile

# Internal plaintext listener — only reachable on the private docker network,
# used by the control-plane API bridge (never published to the internet).
listener 1883
protocol mqtt

# Public TLS listener for devices (mqtt.circuvent.com:8883 / or the VM IP).
# Uses Circuvent's OWN CA (fully self-owned) generated by scripts/gen-certs.sh
# and mounted at /mosquitto/certs. Device firmware embeds ca.crt to trust it.
listener 8883
protocol mqtt
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
require_certificate false

# Reasonable limits for a free-tier VM.
max_queued_messages 1000
max_inflight_messages 40
