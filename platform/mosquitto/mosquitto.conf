# Circuvent MQTT broker — device-facing, fully self-owned.
persistence true
persistence_location /mosquitto/data/

# No anonymous clients. Auth via password file; per-topic access via ACLs.
allow_anonymous false
password_file /mosquitto/pw/passwordfile
acl_file /mosquitto/config/aclfile

# Internal plaintext listener — only reachable on the private docker network,
# used by the control-plane API bridge (never published to the internet).
listener 1883
protocol mqtt

# Public TLS listener for devices (mqtt.circuvent.com:8883).
# Certificates are obtained + renewed by Caddy and shared via the caddy_data
# volume (mounted read-only at /certs). Pinned to Let's Encrypt (see Caddyfile).
listener 8883
protocol mqtt
certfile /certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mqtt.circuvent.com/mqtt.circuvent.com.crt
keyfile  /certs/caddy/certificates/acme-v02.api.letsencrypt.org-directory/mqtt.circuvent.com/mqtt.circuvent.com.key

# Reasonable limits for a free-tier VM.
max_queued_messages 1000
max_inflight_messages 40
