services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: circuvent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: circuvent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuvent"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &default-logging
      # Docker's default json-file driver grows without bound. On a small VM the
      # logs eventually fill the disk, and when the disk is full Postgres stops
      # accepting writes and the broker stops persisting — an outage caused
      # entirely by bookkeeping. Cap and rotate.
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks: [internal]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_pw:/mosquitto/pw
    ports:
      - "8883:8883"   # device MQTT over TLS (public)
    healthcheck:
      # The broker is the single point every device depends on, so a hung
      # process should be restarted rather than left accepting TCP and serving
      # nothing.
      #
      # Exit code 5 counts as healthy. The broker requires authentication and
      # this probe deliberately carries no credentials — putting the
      # control-plane password into a healthcheck would spread a secret across
      # another file for no gain. Code 5 is an MQTT CONNACK saying "not
      # authorised", which means the broker parsed a CONNECT and replied: it is
      # alive, which is the only thing a liveness probe should assert. A dead
      # or hung broker fails at TCP and returns something else.
      #
      # The first version of this treated 5 as failure and reported a perfectly
      # healthy broker as unhealthy for forty minutes.
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/#' -C 1 -W 3 -i healthcheck -q 1 >/dev/null 2>&1; c=$$?; [ $$c -eq 0 ] || [ $$c -eq 5 ]"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks: [internal]

  api:
    build:
      context: ./api
      args:
        # Stamped into /health so a stale container identifies itself instead
        # of looking like a broken camera. Set them when you deploy:
        #   BUILD_COMMIT=$(git rev-parse --short HEAD) \
        #   BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
        #   docker compose up -d --build
        BUILD_COMMIT: ${BUILD_COMMIT:-unknown}
        BUILD_TIME: ${BUILD_TIME:-unknown}
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://circuvent:${POSTGRES_PASSWORD}@postgres:5432/circuvent
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: control-plane
      MQTT_PASSWORD: ${MQTT_CONTROL_PLANE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      NODE_ENV: production
      SMARTHOME_CLIENT_ID: ${SMARTHOME_CLIENT_ID:-circuvent-smarthome}
      SMARTHOME_CLIENT_SECRET: ${SMARTHOME_CLIENT_SECRET}
      # Was declared in config.ts and never passed through, so setting it in
      # .env silently did nothing and an extra account-linking redirect URI
      # could not be added at all. Same class of fault as FEDERATION_SECRET;
      # config-passthrough.test.ts now fails the build on a missing key.
      SMARTHOME_REDIRECT_URIS: ${SMARTHOME_REDIRECT_URIS:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Circuvent <onboarding@resend.dev>}
      OTP_TTL_MIN: ${OTP_TTL_MIN:-10}
      OTP_DEBUG: ${OTP_DEBUG:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      FEDERATION_SECRET: ${FEDERATION_SECRET:-}
      # ANPR. These MUST be listed here, not only in .env.example: compose
      # passes through exactly what is named below, which is how
      # FEDERATION_SECRET stayed silently unset and SSO kept returning 501.
      # FaceDoor face embedding. Optional in the same way ANPR is: with
      # "none" the lock still enrols at the door and still matches descriptors
      # a hub posts, and only enrolment from a photograph is unavailable.
      FACE_EMBEDDER: ${FACE_EMBEDDER:-none}
      FACE_BASE_URL: ${FACE_BASE_URL:-}
      FACE_API_KEY: ${FACE_API_KEY:-}
      FACE_TIMEOUT_MS: ${FACE_TIMEOUT_MS:-10000}
      ANPR_PROVIDER: ${ANPR_PROVIDER:-none}
      ANPR_BASE_URL: ${ANPR_BASE_URL:-}
      ANPR_API_KEY: ${ANPR_API_KEY:-}
      ANPR_MODEL: ${ANPR_MODEL:-gpt-4o-mini}
      ANPR_REGION: ${ANPR_REGION:-in}
      ANPR_TIMEOUT_MS: ${ANPR_TIMEOUT_MS:-12000}
      ANPR_MIN_CONFIDENCE: ${ANPR_MIN_CONFIDENCE:-70}
      ANPR_RETENTION_DAYS: ${ANPR_RETENTION_DAYS:-90}
      ANPR_IMAGE_RETENTION_DAYS: ${ANPR_IMAGE_RETENTION_DAYS:-30}
      ANPR_THUMBNAIL_MAX_KB: ${ANPR_THUMBNAIL_MAX_KB:-96}
      # Sender for the daily gate report. Separate from EMAIL_FROM, which signs
      # OTP and password-reset mail from a no-reply identity — a report is
      # something a facilities manager replies to. Must stay on a domain
      # mail.circuvent.com signs with DKIM, or every report fails DMARC.
      REPORT_FROM: ${REPORT_FROM:-Circuvent <info@circuvent.com>}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    logging: *default-logging
    networks: [internal]

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_pw:
  caddy_data:
  caddy_config:

networks:
  internal:
