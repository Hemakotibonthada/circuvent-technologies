services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: circuvent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: circuvent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U circuvent"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: &default-logging
      # Docker's default json-file driver grows without bound. On a small VM the
      # logs eventually fill the disk, and when the disk is full Postgres stops
      # accepting writes and the broker stops persisting — an outage caused
      # entirely by bookkeeping. Cap and rotate.
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    networks: [internal]

  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/aclfile:/mosquitto/config/aclfile:ro
      - ./mosquitto/certs:/mosquitto/certs:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_pw:/mosquitto/pw
    ports:
      - "8883:8883"   # device MQTT over TLS (public)
    healthcheck:
      # The broker is the single point every device depends on, so a hung
      # process should be restarted rather than left accepting TCP but serving
      # nothing. mosquitto_sub ships in the image.
      test: ["CMD-SHELL", "mosquitto_sub -h 127.0.0.1 -p 1883 -t '$$SYS/#' -C 1 -W 3 -i healthcheck -q 1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks: [internal]

  api:
    build: ./api
    restart: unless-stopped
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://circuvent:${POSTGRES_PASSWORD}@postgres:5432/circuvent
      MQTT_URL: mqtt://mosquitto:1883
      MQTT_USERNAME: control-plane
      MQTT_PASSWORD: ${MQTT_CONTROL_PLANE_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      NODE_ENV: production
      SMARTHOME_CLIENT_ID: ${SMARTHOME_CLIENT_ID:-circuvent-smarthome}
      SMARTHOME_CLIENT_SECRET: ${SMARTHOME_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      EMAIL_FROM: ${EMAIL_FROM:-Circuvent <onboarding@resend.dev>}
      OTP_TTL_MIN: ${OTP_TTL_MIN:-10}
      OTP_DEBUG: ${OTP_DEBUG:-false}
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      FEDERATION_SECRET: ${FEDERATION_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      mosquitto:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging: *default-logging
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]
    logging: *default-logging
    networks: [internal]

volumes:
  pgdata:
  mosquitto_data:
  mosquitto_pw:
  caddy_data:
  caddy_config:

networks:
  internal:
